<script>
(function(){
/* Layout and motion follow the LinkedIn Review web app: floating pill nav, Overview as a
   scroll story under a sticky hero, other tabs as glass-card pages. Data: one getData() call. */
const ICONS={
 overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
 queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 posts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14l-4-3H6a2 2 0 0 1-2-2z"/><path d="M8 8h8M8 12h5"/></svg>',
 coverage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="5" rx="1.2"/><rect x="10" y="3" width="5" height="5" rx="1.2"/><rect x="17" y="3" width="4" height="5" rx="1.2"/><rect x="3" y="10" width="5" height="5" rx="1.2"/><rect x="10" y="10" width="5" height="5" rx="1.2"/><rect x="3" y="17" width="5" height="4" rx="1.2"/></svg>',
 office:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="9" width="14" height="3" rx="1"/><path d="M7 12v8M17 12v8"/><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/></svg>',
 runs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 8v4l3 2"/></svg>'
};
const PLUS='<span class="plus"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></svg></span>';
const TABS=[["overview","Overview"],["office","Office"],["queue","Queue"],["posts","Posts"],["coverage","Coverage"],["runs","Runs"]];
const ST={posted:"Created & Posted",scheduled:"Created & Scheduled",queued:"Not Created / In Queue",dropped:"Dropped"};
const DIMS=[["senior_depth","Senior depth"],["specificity","Specificity"],["narrow_scope","Narrow scope"],["credibility","Credibility"],["voice","Voice"]];
const HORIZON=13;
const S={d:null,err:null,tab:"overview",runId:null,sort:"date",loaded:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isNaN(n)?null:n};
const motionOK=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function iso(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`:null}
function dt(i){const p=i.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
const fmt=(i,o)=>i?dt(i).toLocaleDateString(undefined,o):"";
const fmtDate=i=>fmt(i,{year:"numeric",month:"short",day:"numeric"});
const fmtShort=i=>fmt(i,{month:"short",day:"numeric"});
const fmtDay=i=>fmt(i,{weekday:"short",month:"short",day:"numeric"});
const compact=n=>n==null?"–":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"k":String(n);
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?"–":v.toFixed(1);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

S.tab=ls.get("lp.tab")||"overview";
{const th=ls.get("lp.theme");document.documentElement.setAttribute("data-theme",th==="dark"?"dark":"light")}
if(location.hash&&TABS.some(t=>t[0]===location.hash.slice(1)))S.tab=location.hash.slice(1);

function ring(pct,color,size,spin){size=size||22;const r=(size-4)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="2.2"/><g class="${spin?"spin":""}"><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></g></svg>`}
function scoreRing(v,size,label){size=size||46;return `<span class="sumring" style="width:${size}px;height:${size}px">${ring(v==null?0:v/5,"var(--accent)",size)}<b ${size>80?'style="font-size:1.9rem;font-family:var(--f);font-weight:600;letter-spacing:-.04em"':""}>${f1(v)}</b>${label?`<span class="eyebrow" style="position:absolute;bottom:22px">${label}</span>`:""}</span>`}

/* ---------- data ---------- */
function runs(){return (S.d.runs||[]).slice().sort((a,b)=>String(b.run_id).localeCompare(String(a.run_id)))}
function run(){const rs=runs();return rs.find(r=>r.run_id===S.runId)||rs[0]||null}
function sched(){return (S.d.schedule||[]).map(r=>Object.assign({},r,{iso:iso(r.date)}))}
function scoresFor(r){
  return (S.d.scores||[]).filter(s=>!r||s.run_id===r.run_id).map(s=>{
    const o={run_id:s.run_id,date:iso(s.post_date),pillar:s.pillar,lens:s.lens,topic:s.topic,url:s.linkedin_url,note:s.notes,
      reactions:num(s.reactions),comments:num(s.comments),reposts:num(s.reposts),impressions:num(s.impressions),score:num(s.score)};
    DIMS.forEach(([k])=>o[k]=num(s[k]));if(o.score==null)o.score=avgOf(DIMS.map(([k])=>o[k]).filter(v=>v!=null));return o;
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function dimAvgs(sc){return DIMS.map(([k,l])=>({k,l,v:avgOf(sc.map(s=>s[k]).filter(v=>v!=null))}))}
function horizon(){const t=dt(S.d.today);const d=new Date(t);d.setDate(d.getDate()+1);while(d.getDay()!==6)d.setDate(d.getDate()+1);
  const out=[];for(let i=0;i<HORIZON;i++){const x=new Date(d);x.setDate(d.getDate()+7*i);out.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`)}return out}
function upcoming(){return sched().filter(r=>(r.status===ST.scheduled||r.status===ST.queued)&&r.iso&&r.iso>S.d.today).sort((a,b)=>a.iso.localeCompare(b.iso))}
/* Change-log entries of the latest run that wrote one, keyed by date+topic (tests, editor verdicts). */
function changeIndex(){const m={};const r=runs().find(x=>(x.change_log||[]).length);(r?r.change_log:[]).forEach(e=>{if(e.op!=="DROP")m[e.date+"|"+e.topic]=e});return m}
function statusChip(s){return s===ST.posted?'<span class="chip">Posted</span>':s===ST.scheduled?'<span class="chip good">Scheduled</span>':s===ST.dropped?'<span class="chip crit">Dropped</span>':'<span class="chip med">Queued</span>'}
const shortStatus=s=>s===ST.posted?"Posted":s===ST.scheduled?"Scheduled":s===ST.dropped?"Dropped":"Queued";
function flagged(e){return !!(e&&e.editor&&(e.editor.issues||[]).length)}
function parseCoverage(s){const out={pillars:{},lenses:{}};String(s||"").split("|").forEach(part=>{const m=part.trim().match(/^(Pillars|Lenses):\s*(.*)$/);if(!m)return;const tgt=m[1]==="Pillars"?out.pillars:out.lenses;
  m[2].split(/,\s*/).forEach(x=>{const mm=x.trim().match(/^(.*)\s(\d+)$/);if(mm)tgt[mm[1]]=+mm[2]})});return out}

/* ---------- nav ---------- */
function renderNav(){
  const rs=S.d?runs():[];const r=S.d?run():null;
  const sel=rs.length>1?`<label class="runpick"><select id="runSel" aria-label="Choose agent run">${rs.map((x,i)=>`<option value="${esc(x.run_id)}" ${r&&x.run_id===r.run_id?"selected":""}>${esc(fmtDate(iso(x.run_at)))}${i===0?" · latest":""}</option>`).join("")}</select></label>`:"";
  $("#nav").innerHTML=`<div class="logo" aria-hidden="true">LP</div><span class="brandname">LinkedIn Posts</span>${TABS.map(([k,l])=>`<button class="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("")}${sel}<button class="themebtn" id="themeBtn" aria-label="Switch to ${isDark()?"light":"dark"} mode">${isDark()?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'}</button>`;
  $("#bottombar").innerHTML=TABS.map(([k,l])=>`<button class="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");
}

/* ---------- overview: scroll story ---------- */
function viewOverview(){
  const r=run();const sc=scoresFor(r);const avg=avgOf(sc.map(s=>s.score).filter(v=>v!=null));
  const up=upcoming();const next=up[0];const hz=horizon();const dates=new Set(up.map(x=>x.iso));
  const covered=hz.filter(d=>dates.has(d)).length;const last=up.length?up[up.length-1].iso:null;
  const plan=sched().filter(x=>x.status!==ST.dropped);
  const pIn=S.d.pillars.filter(p=>up.some(x=>x.pillar===p)).length,lIn=S.d.lenses.filter(l=>up.some(x=>x.lens===l)).length;
  const da=dimAvgs(sc).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const ci=changeIndex();const flags=up.filter(x=>flagged(ci[x.iso+"|"+x.topic]));
  const neverPub=S.d.pillars.filter(p=>!plan.some(x=>x.pillar===p&&(x.status===ST.posted))).map(p=>({p,planned:up.find(x=>x.pillar===p)}));
  const stages=[
    ["posts","Posts scored",sc.length?`${sc.length} posts · average ${f1(avg)} of 5`:"No scores yet",avg!=null?avg/5:0],
    ["queue","Queue",`${covered} of ${HORIZON} Saturdays covered${last?` · backlog to ${fmtShort(last)}`:""}`,covered/HORIZON],
    ["coverage","Coverage plan",`${pIn} of ${S.d.pillars.length} pillars · ${lIn} of ${S.d.lenses.length} lenses ahead`,(pIn+lIn)/(S.d.pillars.length+S.d.lenses.length)],
    ["runs","Last run",r?`${fmtShort(iso(r.run_at))} · +${num(r.added)||0} added · ${num(r.edited)||0} edited · ${num(r.dropped)||0} dropped`:"No runs yet",r?1:0]
  ];
  return `
  <section class="scene-hero">
    <div class="hero-sticky" data-exit>
      <span class="eyebrow">${next?`Next post · ${esc(fmtDay(next.iso))}`:"Nothing scheduled"}</span>
      <h1 class="hero-title">${next?`<span class="tone">${esc(next.pillar)}</span>${esc(next.lens)}`:`<span class="tone">Queue</span>is empty`}</h1>
      <p class="hero-sub">${next?esc(next.topic):"Run /linkedin-ideas to fill the next Saturdays."}</p>
      ${next?`<div class="chips" style="justify-content:center">${statusChip(next.status)}</div>`:""}
      <div class="scrollcue"><i></i>Scroll</div>
    </div>
  </section>
  <div class="over">
    <div class="pills">${stages.map(st=>`<button class="pill glass" data-rv data-tab="${st[0]}" style="border:0;cursor:pointer"><span class="ic">${ICONS[st[0]]}</span><span class="tx"><b>${st[1]}</b><span>${esc(st[2])}</span></span>${ring(st[3],"var(--accent)",22)}</button>`).join("")}</div>
    <section class="glass dash" data-rv>
      <div>
        <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:0"><span class="eyebrow">Content score · last ${sc.length} posts</span><div class="big" style="margin-top:6px"><span class="n">${f1(avg)}</span><span class="u">out of 5</span></div></div>
          <div class="seg" aria-hidden="true"><span class="on">Per post</span><span>${esc(r?fmtShort(iso(r.run_at)):"")}</span></div>
        </div>
        <div class="chart" id="scoreChart">${scoreChart(sc)}</div>
        <div class="stats">
          <div class="stat"><b>${da[0]?f1(da[0].v):"–"}</b><span>Best: ${esc(da[0]?da[0].l:"–")}</span></div>
          <div class="stat"><b>${da.length?f1(da[da.length-1].v):"–"}</b><span>Weakest: ${esc(da.length?da[da.length-1].l:"–")}</span></div>
          <div class="stat"><b>${sc.filter(s=>s.score>=4).length}<span style="font-size:.8rem;color:var(--muted)">/${sc.length}</span></b><span>Scored 4.0 or more</span></div>
        </div>
      </div>
      <div>
        <div style="display:flex;align-items:baseline;gap:8px"><h3 style="font-size:1rem">Next four Saturdays</h3><button class="link" data-tab="queue" style="margin-left:auto;font-size:.82rem">Full queue →</button></div>
        <div class="rows" style="margin-top:6px">${up.slice(0,4).map(x=>`<div class="row"><span class="when" style="width:40px"><small>${esc(fmt(x.iso,{month:"short"}))}</small><b style="font-size:1.05rem">${dt(x.iso).getDate()}</b></span><span class="tx"><span class="clamp">${esc(x.topic)}</span><small>${esc(x.pillar)} · ${esc(x.lens)}</small></span><span class="v">${shortStatus(x.status)}</span></div>`).join("")||'<p class="muted">Nothing queued.</p>'}</div>
      </div>
    </section>
    ${r&&r.strategist_feedback?`<section class="scene-h" data-rv><span class="eyebrow">Content strategist · ${esc(fmtDate(iso(r.run_at)))}</span><h2><span class="tone">What your best posts</span> have in common</h2></section>
    <section class="glass card" data-rv style="display:flex;flex-direction:column;gap:14px"><p class="qans">${esc(r.strategist_feedback)}</p>${r.pillar_lens_suggestions?`<div class="chips"><span class="eyebrow" style="align-self:center;margin-right:4px">Suggests</span><span class="tag">${esc(r.pillar_lens_suggestions)}</span></div>`:""}</section>`:""}
    <div class="grid2">
      <section class="glass card" data-rv>
        <div class="sec-h"><h2>Editor flags</h2><span class="muted">${flags.length} open</span></div>
        ${flags.length?`<div class="rows">${flags.map(x=>{const e=ci[x.iso+"|"+x.topic];return `<div class="row"><span class="when" style="width:40px"><small>${esc(fmt(x.iso,{month:"short"}))}</small><b style="font-size:1.05rem">${dt(x.iso).getDate()}</b></span><span class="tx"><span class="clamp2">${esc(x.topic)}</span><small class="clamp2">${esc((e.editor.issues||[])[0]||"")}</small></span></div>`}).join("")}</div>`:'<p class="muted">No open flags on queued ideas.</p>'}
        <button class="link" data-tab="queue" style="margin-top:14px">Review in queue →</button>
      </section>
      <section class="glass card" data-rv>
        <div class="sec-h"><h2>Not published yet</h2><span class="muted">Pillars with no post so far</span></div>
        ${neverPub.length?`<div class="rows">${neverPub.map(n=>`<div class="row"><span class="tx">${esc(n.p)}<small>${n.planned?`Planned ${esc(fmtShort(n.planned.iso))} · ${esc(n.planned.lens)}`:"Not in the queue"}</small></span>${n.planned?'<span class="chip acc">Planned</span>':'<span class="chip high">Gap</span>'}</div>`).join("")}</div>`:'<p class="muted">Every pillar has at least one post.</p>'}
        <button class="link" data-tab="coverage" style="margin-top:14px">Full coverage →</button>
      </section>
    </div>
  </div>`;
}
function scoreChart(sc){
  const pts=sc.filter(s=>s.score!=null&&s.date);
  if(pts.length<2)return `<p class="muted" style="font-size:.86rem;padding-block:30px">The chart appears once two posts are scored.</p>`;
  const W=560,H=190,L=26,R=10,T=26,B=26;const x=i=>L+(W-L-R)*(i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-1)/4);
  const P=pts.map((p,i)=>[x(i),y(p.score)]);
  let d=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  const area=d+` L${P[P.length-1][0]},${H-B} L${P[0][0]},${H-B} Z`;const k=P.length-1;
  S._chart={pts,P,W,H};
  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Content score per post, oldest to newest" id="chartSvg">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[1,2,3,4,5].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-8}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Geist Mono, monospace">${v}</text>`).join("")}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" class="draw"/>
    <line id="cx" x1="${P[k][0]}" x2="${P[k][0]}" y1="${P[k][1]}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-width="1"/>
    <circle id="cdot" cx="${P[k][0]}" cy="${P[k][1]}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    ${lbl.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="10" fill="var(--muted)" font-family="Geist Mono, monospace">${esc(fmtShort(pts[i].date))}</text>`).join("")}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="ctip" style="left:${(P[k][0]/W*100).toFixed(2)}%;top:${(P[k][1]/H*100).toFixed(2)}%">${f1(pts[k].score)}<b>${esc(fmtShort(pts[k].date))}</b></div>`;
}
function chartHover(e){
  const C=S._chart,svg=document.getElementById("chartSvg");if(!C||!svg)return;
  const b=svg.getBoundingClientRect();const xv=(e.clientX-b.left)/b.width*C.W;
  let best=0;C.P.forEach((p,i)=>{if(Math.abs(p[0]-xv)<Math.abs(C.P[best][0]-xv))best=i});
  const p=C.P[best],pt=C.pts[best];
  const cx=document.getElementById("cx"),cd=document.getElementById("cdot"),tip=document.getElementById("ctip");
  cx.setAttribute("x1",p[0]);cx.setAttribute("x2",p[0]);cx.setAttribute("y1",p[1]);cd.setAttribute("cx",p[0]);cd.setAttribute("cy",p[1]);
  tip.style.left=(p[0]/C.W*100)+"%";tip.style.top=(p[1]/C.H*100)+"%";tip.innerHTML=`${f1(pt.score)}<b>${esc(fmtShort(pt.date))} · ${esc(pt.pillar||"")}</b>`;
}

/* ---------- queue ---------- */
function queueItem(x,ci){
  const e=ci[x.iso+"|"+x.topic];const ed=e&&e.editor;const fl=flagged(e);
  const was=e&&e.was&&e.op!=="ADD"?["date","pillar","lens","topic"].filter(k=>e.was[k]&&e.was[k]!==e[k]).map(k=>`${k}: ${k==="date"?fmtShort(e.was[k]):e.was[k]}`).join(" · "):"";
  const pot=ed&&ed.potential?Object.keys(ed.potential).map(k=>{const lbl=(DIMS.find(d=>d[0]===k)||[k,k])[1];return `<div class="scrow"><span>${esc(lbl)}</span><span class="mono">${esc(ed.potential[k])}</span><div class="meter"><i style="width:${ed.potential[k]/5*100}%;background:var(--accent)"></i></div></div>`}).join(""):"";
  return `<details class="item glass" id="q-${esc(x.iso||"")}">
    <summary>${x.iso?`<span class="when"><small>${esc(fmt(x.iso,{month:"short"}))}</small><b>${dt(x.iso).getDate()}</b><small>${esc(fmt(x.iso,{weekday:"short"}))}</small></span>`:'<span class="when"><small>No</small><b>–</b><small>date</small></span>'}
      <div class="sum-main"><h3>${esc(x.topic)}</h3><div class="chips"><span class="chip acc">${esc(x.pillar)}</span><span class="chip">${esc(x.lens)}</span>${statusChip(x.status)}${x.source?`<span class="chip">${esc(x.source)}</span>`:""}${ed&&ed.avg!=null?`<span class="chip">Editor ${esc(ed.avg)}</span>`:""}${fl?'<span class="chip high">⚑ Editor flag</span>':""}</div></div>${PLUS}</summary>

const ocNote=t=>`<p class="muted" style="font-size:.76rem">${t}</p>`;
/* ---- per-run series for the Trend section: one value per run, oldest first, up to the run being viewed ---- */
const statOf=(r,k)=>r.agent_stats&&r.agent_stats[k]||null;
const ideasOf=r=>(r.change_log||[]).filter(e=>e.op!=="DROP").length;
const editorAvgOf=r=>avgOf((r.change_log||[]).filter(e=>e.op!=="DROP"&&e.editor&&e.editor.avg!=null).map(e=>+e.editor.avg));
const subOf=(r,f)=>{const v=["reviewer","strategist","editor"].map(k=>f(statOf(r,k)));return v.some(x=>x!=null)?v.reduce((a,x)=>a+(x||0),0):null};

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex:none;overflow:visible"><polyline points="${xy.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.2" fill="var(--accent)"/></svg>`}

/* Labelled meters: [{l, sub, v (text), pct 0-1, color}] */

/* Content score (x) against impressions (y, log scale: a couple of posts reach 20x the rest), one dot per post. */
function reachPlot(sc){

    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--line)"/><line x1="${L}" y1="${Tp}" x2="${L}" y2="${H-B}" stroke="var(--line)"/>
    ${[1,2,3,4,5].map(v=>tick(v,v)).join("")}<text x="${L-5}" y="${Tp+7}" text-anchor="end">${compact(maxI)}</text><text x="${L-5}" y="${H-B}" text-anchor="end">0</text>${maxI>3000?`<line x1="${L}" y1="${Y(1000)}" x2="${W-R}" y2="${Y(1000)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L-5}" y="${Y(1000)+3}" text-anchor="end">1k</text>`:""}
    ${pts.map(s=>`<circle cx="${X(s.score).toFixed(1)}" cy="${Y(s.impressions).toFixed(1)}" r="4" fill="var(--accent)" fill-opacity=".75" stroke="var(--surface)" stroke-width="1"><title>${esc(s.topic)} · score ${f1(s.score)} · ${fmtN(s.impressions)} impressions · ${fmtN(s.reactions)} reactions</title></circle>`).join("")}

let ticking=false;

function applyMotion(){
  ticking=false;document.documentElement.style.setProperty("--sy",String(scrollY));if(!motionOK)return;
  const vh=window.innerHeight;

  if(ex){const host=ex.parentElement.getBoundingClientRect();const q=Math.max(0,Math.min(1,(-host.top)/(vh*.55)));
    ex.style.opacity=String(1-q*.95);ex.style.transform=`translateY(${-q*70}px) scale(${1-q*.05})`;ex.style.filter=q>0.01?`blur(${(q*10).toFixed(1)}px)`:"none";}

    p=1-Math.pow(1-p,3);

    for(const p of ps){const tr=p.tr;if(tr.length<2)continue;const fadeIn=Math.min(1,p.age/30),fadeOut=Math.min(1,p.life/40);const A=(dark?.5:.32)*fadeIn*fadeOut;
      for(let i=1;i<tr.length;i++){const k=i/tr.length;ctx.strokeStyle=`rgba(${cols[p.hue]},${(A*k).toFixed(3)})`;ctx.lineWidth=p.w*(.4+.8*k);ctx.beginPath();ctx.moveTo(tr[i-1][0],tr[i-1][1]);ctx.lineTo(tr[i][0],tr[i][1]);ctx.stroke()}
      ctx.fillStyle=`rgba(${cols[p.hue]},${(A*1.6).toFixed(3)})`;const h=tr[tr.length-1];ctx.fillRect(h[0]-p.w*.8,h[1]-p.w*.8,p.w*1.6,p.w*1.6)}
  }
  function frame(){if(!document.hidden){t+=16;const dy=scrollY-lastY;lastY=scrollY;step(dy);draw()}requestAnimationFrame(frame)}
  size();addEventListener("resize",size);window.__retheme=(window.__retheme||[]);window.__retheme.push(()=>{col();if(!motionOK)draw()});
  if(motionOK)requestAnimationFrame(frame);else{for(let i=0;i<TL;i++){t+=16;step(0)}draw()}
})();

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("#themeBtn")){const d=!isDark();document.documentElement.setAttribute("data-theme",d?"dark":"light");ls.set("lp.theme",d?"dark":"light");(window.__retheme||[]).forEach(f=>f());window.Office&&Office.setTheme(d);renderNav();return}
  if(e.target.closest("#oReset")){Office.home();return}
  if(e.target.closest("#oPause")){const b=e.target.closest("#oPause");const p=!Office.isPaused();Office.pause(p);b.setAttribute("aria-pressed",p);b.textContent=p?"Play":"Pause";return}
  if(e.target.closest("[data-oclose]")){Office.home();return}
  const sb=e.target.closest("[data-sort]");if(sb){S.sort=sb.dataset.sort;render(true);return}
  const rb=e.target.closest("[data-run]");if(rb){S.runId=rb.dataset.run;ls.set("lp.run",S.runId);render();window.scrollTo({top:0});return}
  const nb=e.target.closest("[data-tab]");
  if(nb){S.tab=nb.dataset.tab;ls.set("lp.tab",S.tab);$("#htip").hidden=true;render();window.scrollTo({top:0});return}
});
document.addEventListener("pointermove",e=>{
  if(e.target.closest&&e.target.closest("#scoreChart"))chartHover(e);
  heatTip(e);
  const g=e.target.closest&&e.target.closest(".glass");if(g){const b=g.getBoundingClientRect();g.style.setProperty("--mx",(e.clientX-b.left)+"px");g.style.setProperty("--my",(e.clientY-b.top)+"px")}
},{passive:true});
document.addEventListener("change",e=>{if(e.target.id==="runSel"){S.runId=e.target.value;ls.set("lp.run",S.runId);render();window.scrollTo({top:0})}});

/* ---------- load ---------- */
function load(){
  google.script.run.withSuccessHandler(raw=>{
    const first=!S.loaded;S.d=JSON.parse(raw);S.err=null;S.loaded=true;
    const saved=ls.get("lp.run");const rs=runs();
    if(!S.runId||!rs.some(r=>r.run_id===S.runId))S.runId=(saved&&rs.some(r=>r.run_id===saved))?saved:(rs[0]&&rs[0].run_id);
    render(!first);
  }).withFailureHandler(err=>{S.err=(err&&err.message)||String(err);render()}).getData();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.loaded)load()});
renderNav();load();
})();
</script>
