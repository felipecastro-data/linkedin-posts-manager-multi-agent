<script>
/* LinkedIn Posts — 3D agent office (three.js r147, UMD build, loaded on first open).
   Isometric cut-away room after Felipe's reference render: window wall with curtains and a
   city view, TV wall with two sconces, one long oak table, six mesh chairs. Six androids
   (three styles from the reference figures) act out a /linkedin-ideas run on a loop:
   coordinator -> collector -> reviewer -> strategist -> editor -> strategist -> editor ->
   writer -> TV -> coordinator. Everything with a card is clickable. */
(function(){
const CDN="https://cdn.jsdelivr.net/npm/three@0.147.0/";
const LIBS=["build/three.min.js","examples/js/controls/OrbitControls.js","examples/js/geometries/RoundedBoxGeometry.js","examples/js/environments/RoomEnvironment.js"];
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=n=>n==null?"–":Number(n).toLocaleString();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let T,O={};            // THREE and office state
let loading=null;
function loadLibs(){
  if(window.THREE&&THREE.OrbitControls&&THREE.RoundedBoxGeometry&&THREE.RoomEnvironment)return Promise.resolve();
  if(loading)return loading;
  loading=LIBS.reduce((p,f)=>p.then(()=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=CDN+f;s.onload=res;s.onerror=()=>rej(new Error("Couldn't load "+f));document.head.appendChild(s)})),Promise.resolve());
  return loading;
}

/* ---------------- agents ---------------- */
const AGENTS=[
 {id:"coordinator",name:"Coordinator",role:"Runs /linkedin-ideas",kind:"Coordinator",style:"C",hood:"#36383d",shell:"#1d1f23",accent:"#f2a65a",seat:{side:"L",z:-1.35},
  desc:"Owns the run from start to finish: preflight, collecting, matching posts to rows, launching the three subagents, validating, showing you the diff, and writing only after your approval.",
  does:["Starts the run and keeps the task list","Launches Reviewer, Strategist and Editor","Shows the diff and waits for your approval"]},
 {id:"strategist",name:"Content Strategist",role:"Ideas lead",kind:"Claude subagent",style:"B",hood:"#9c9c98",shell:"#111114",accent:"#ff9eb5",antenna:true,seat:{side:"L",z:0.45},
  desc:"Owns strategy. Reads coverage, content scores and every past post, then proposes the full queue: keep, edit, move, add or drop, each with a rationale and a reproducible test.",
  does:["Rotates pillars and lenses evenly","Shapes ideas like your best-scoring posts","Revises once after the Editor"]},
 {id:"collector",name:"Collector",role:"Reads LinkedIn and the sheet",kind:"Script step",style:"A",hood:"#707276",shell:"#121215",accent:"#7fd3c7",seat:{side:"R",z:-2.0},
  desc:"Reads the Posts Schedule, Pillars and Lenses from the sheet and the full text of every LinkedIn post through Chrome, then matches each post to its row by the publish date hidden in its URL.",
  does:["Reads the sheet tables","Reads every post's full text","Matches posts to rows by exact date"]},
 {id:"reviewer",name:"Content Reviewer",role:"Scores published posts",kind:"Claude subagent",style:"B",hood:"#858683",shell:"#111114",accent:"#ff9eb5",antenna:false,seat:{side:"R",z:-0.67},
  desc:"Scores each published post 1 to 5 on senior depth, specificity, narrow scope, credibility and voice. Engagement is recorded for context and never counts.",
  does:["Scores five dimensions per post","Notes recurring rule slips","Finds what the best posts share"]},
 {id:"editor",name:"Editor",role:"Reviews every idea",kind:"Claude subagent",style:"C",hood:"#53565c",shell:"#25272c",accent:"#ff9eb5",seat:{side:"R",z:0.67},
  desc:"Independent reviewer. Checks every proposed idea for duplicates, scope, feasibility and banned wording, and scores its potential. Sends the queue back once, then labels what is left.",
  does:["Catches near-duplicates","Checks each test can produce real numbers","Flags anything below 3.5"]},
 {id:"writer",name:"Sheet Writer",role:"Validates and writes",kind:"Script step",style:"A",hood:"#46484e",shell:"#121215",accent:"#9fc3ff",seat:{side:"R",z:2.0},
  desc:"Runs the hard rule checks (rotation, one idea per Saturday, only queued rows touched), builds the exact writes, and updates the sheet after you approve. Reads every row back to confirm.",
  does:["Validates the rotation rules","Builds writes without sending","Writes and reads back"]}
];
const BYID={};AGENTS.forEach(a=>BYID[a.id]=a);
const STEPS=[
 {a:"coordinator",to:"collector",dur:3.2,txt:m=>"Starting /linkedin-ideas"},
 {a:"collector",to:"reviewer",dur:4.2,txt:m=>`Reading ${m.posts.n} posts and ${m.stats&&m.stats.collector?m.stats.collector.metrics.schedule_rows:"the"} schedule rows`},
 {a:"reviewer",to:"strategist",dur:4.4,txt:m=>`Scoring ${m.posts.n} posts · average ${m.posts.avgTxt}`},
 {a:"strategist",to:"editor",dur:5,txt:m=>`Proposing the queue · +${m.ops.added} ideas`},
 {a:"editor",to:"strategist",dur:4,txt:m=>"Reviewing every idea · sends it back once"},
 {a:"strategist",to:"editor",dur:3.4,txt:m=>"Revising after the Editor"},
 {a:"editor",to:"writer",dur:2.8,txt:m=>`Final review · ${m.queue.flags.length} flag${m.queue.flags.length===1?"":"s"} left`},
 {a:"writer",to:"tv",dur:3.4,txt:m=>`Checking rules · writing ${m.stats&&m.stats.writer?m.stats.writer.metrics.schedule_rows:""} rows`},
 {a:"coordinator",to:null,dur:2.8,txt:m=>"Run complete · diff approved"}
];

/* ---------------- textures ---------------- */
function cv(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return c}
function tex(c,{srgb=true,rep=null}={}){const t=new T.CanvasTexture(c);if(srgb)t.encoding=T.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
function knitCanvas(base,shade){return cv(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);const r=rnd(7);const s=8;
  for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s*.8){const j=(r()-.5)*.06;
    g.strokeStyle=`rgba(255,255,255,${(shade?.2:.07)+j})`;g.lineWidth=2.2;g.beginPath();g.moveTo(x+.5,y);g.lineTo(x+s/2,y+s*.62);g.lineTo(x+s-.5,y);g.stroke();
    g.strokeStyle=`rgba(0,0,0,${(shade?.2:.14)+j})`;g.lineWidth=1.3;g.beginPath();g.moveTo(x+.5,y+2.2);g.lineTo(x+s/2,y+s*.62+2.2);g.lineTo(x+s-.5,y+2.2);g.stroke()}
  for(let i=0;i<2600;i++){g.fillStyle=r()<.5?"rgba(255,255,255,.035)":"rgba(0,0,0,.07)";g.fillRect(r()*w,r()*h,1.5,1.5)}})}
const MAT={};
function knitMat(color){
  const k="knit"+color;if(MAT[k])return MAT[k];
  const map=tex(knitCanvas(color),{rep:[5,5]});const bump=tex(knitCanvas("#808080",true),{srgb:false,rep:[5,5]});
  return MAT[k]=new T.MeshStandardMaterial({map,bumpMap:bump,bumpScale:.012,roughness:1,metalness:0});
}
function glowTex(){return tex(cv(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.25,"rgba(255,255,255,.55)");r.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=r;g.fillRect(0,0,w,h)}))}
function scanTex(){return tex(cv(64,64,(g,w,h)=>{g.clearRect(0,0,w,h);for(let y=0;y<h;y+=4){g.fillStyle="rgba(255,255,255,1)";g.fillRect(0,y,w,2.4)}}))}
function woodCanvas(){return cv(1024,256,(g,w,h)=>{g.fillStyle="#d9a96d";g.fillRect(0,0,w,h);const r=rnd(11);
  for(let i=0;i<190;i++){const y=r()*h,a=.03+r()*.08,c=r()<.5?"120,72,30":"250,215,160";g.strokeStyle=`rgba(${c},${a})`;g.lineWidth=.6+r()*2.4;g.beginPath();g.moveTo(0,y);
    for(let x=0;x<=w;x+=32)g.lineTo(x,y+Math.sin(x*.004+i)*4+(r()-.5)*1.2);g.stroke()}
  for(let i=0;i<6;i++){const x=r()*w,y=r()*h;const rg=g.createRadialGradient(x,y,0,x,y,30);rg.addColorStop(0,"rgba(130,80,35,.18)");rg.addColorStop(1,"rgba(130,80,35,0)");g.fillStyle=rg;g.fillRect(x-30,y-30,60,60)}})}
function carpetCanvas(){return cv(256,256,(g,w,h)=>{g.fillStyle="#a49e95";g.fillRect(0,0,w,h);const r=rnd(5);
  for(let i=0;i<9000;i++){const v=r();g.fillStyle=v<.33?"rgba(70,64,58,.22)":v<.66?"rgba(225,220,212,.2)":"rgba(140,132,122,.25)";g.fillRect(r()*w,r()*h,1.6,1.6)}
  g.strokeStyle="rgba(255,255,255,.05)";g.lineWidth=1;for(let x=-h;x<w;x+=6){g.beginPath();g.moveTo(x,0);g.lineTo(x+h,h);g.stroke()}})}
function plasterCanvas(base){return cv(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);const r=rnd(3);for(let i=0;i<5000;i++){g.fillStyle=r()<.5?"rgba(0,0,0,.025)":"rgba(255,255,255,.04)";g.fillRect(r()*w,r()*h,2,2)}})}
function meshCanvas(){return cv(128,128,(g,w,h)=>{g.fillStyle="#17181b";g.fillRect(0,0,w,h);g.strokeStyle="rgba(120,124,132,.35)";g.lineWidth=1;for(let i=0;i<w;i+=5){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}})}
function fabricCanvas(base){return cv(128,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);const r=rnd(9);for(let x=0;x<w;x+=2){g.fillStyle=`rgba(0,0,0,${.03+r()*.05})`;g.fillRect(x,0,1,h)}for(let i=0;i<1500;i++){g.fillStyle="rgba(255,255,255,.05)";g.fillRect(r()*w,r()*h,1,2)}})}
function leafCanvas(c){return cv(64,128,(g,w,h)=>{const lg=g.createLinearGradient(0,0,w,0);lg.addColorStop(0,c[0]);lg.addColorStop(.5,c[1]);lg.addColorStop(1,c[0]);g.fillStyle=lg;g.fillRect(0,0,w,h);
  g.strokeStyle="rgba(210,235,170,.55)";g.lineWidth=2;g.beginPath();g.moveTo(w/2,h);g.lineTo(w/2,0);g.stroke();g.lineWidth=1;g.strokeStyle="rgba(210,235,170,.3)";
  for(let y=h-12;y>8;y-=14){g.beginPath();g.moveTo(w/2,y);g.quadraticCurveTo(w*.75,y-6,w,y-14);g.moveTo(w/2,y);g.quadraticCurveTo(w*.25,y-6,0,y-14);g.stroke()}})}

/* ---------------- geometry helpers ---------------- */
const Yv=()=>new T.Vector3(0,1,0);
function box(w,h,d,m,r,seg){return new T.Mesh(r?new T.RoundedBoxGeometry(w,h,d,seg||4,r):new T.BoxGeometry(w,h,d),m)}
function cyl(rt,rb,h,m,s){return new T.Mesh(new T.CylinderGeometry(rt,rb,h,s||24),m)}
function sph(r,m,ws,hs){return new T.Mesh(new T.SphereGeometry(r,ws||32,hs||20),m)}
function shadowy(o,cast=true,recv=true){o.traverse(c=>{if(c.isMesh){c.castShadow=cast;c.receiveShadow=recv}});return o}
function at(o,x,y,z){o.position.set(x,y,z);return o}
/* capsule built along +Y with unit length scale, placed between points a and b */
function limb(r,m){const mesh=new T.Mesh(new T.CapsuleGeometry(r,.1,6,14),m);mesh.userData.r=r;return mesh}
function setLimb(mesh,a,b){const d=new T.Vector3().subVectors(b,a);const L=Math.max(.01,d.length());
  if(!mesh.userData.L0){mesh.geometry.dispose();mesh.geometry=new T.CapsuleGeometry(mesh.userData.r,L,6,14);mesh.userData.L0=L}
  mesh.position.copy(a).addScaledVector(d,.5);mesh.quaternion.setFromUnitVectors(Yv(),d.normalize());mesh.scale.set(1,L/mesh.userData.L0,1)}
function leafGeo(len,w){const g=new T.PlaneGeometry(1,1,6,10);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i)+.5;
  const wid=Math.pow(Math.sin(Math.PI*Math.min(1,y*1.02)),.7)*(1-.18*y);p.setXYZ(i,x*w*wid,y*len,-.22*len*y*y+Math.abs(x)*w*.18)}g.computeVertexNormals();return g}

/* ---------------- scene ---------------- */
function build(host){
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.domElement.className="o-canvas";
  const scene=new T.Scene();
  const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new T.RoomEnvironment(),.04).texture;
  const camera=new T.OrthographicCamera(-1,1,1,-1,.1,200);
  const controls=new T.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=false;controls.minZoom=.75;controls.maxZoom=2.6;
  controls.minPolarAngle=.55;controls.maxPolarAngle=1.22;controls.minAzimuthAngle=.12;controls.maxAzimuthAngle=1.45;controls.rotateSpeed=.55;
  Object.assign(O,{renderer,scene,camera,controls,pick:[],agents:{},objects:{},laptops:{},glow:glowTex(),scan:scanTex(),clock:new T.Clock(),t:0,host});
  O.home={pos:new T.Vector3(15,12.2,15),target:new T.Vector3(-.15,1.05,0),zoom:1};
  camera.position.copy(O.home.pos);controls.target.copy(O.home.target);camera.zoom=1;

  lights();room();table();
  AGENTS.forEach(a=>seat(a));
  props();city();packet();
  // RoomEnvironment is bright: keep reflections subtle except on glossy visors
  scene.traverse(c=>{if(c.isMesh){[].concat(c.material).forEach(m=>{if(m&&m.envMapIntensity===1)m.envMapIntensity=.42})}});
  O.ringGeo=new T.RingGeometry(.52,.6,48);
}

function lights(){
  const {scene}=O;
  O.hemi=new T.HemisphereLight(0xffffff,0xb8afa3,.38);scene.add(O.hemi);
  const sun=new T.DirectionalLight(0xfff3e2,1.55);sun.position.set(-11,10.5,4.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;sun.shadow.radius=4;
  scene.add(sun);scene.add(sun.target);O.sun=sun;
  const fill=new T.DirectionalLight(0xdfe8ff,.35);fill.position.set(8,6,9);scene.add(fill);O.fill=fill;
  O.lamps=[];[-0.4,3.3].forEach(x=>{const s=new T.SpotLight(0xffd6a6,2.2,7,.75,.85,1.2);s.position.set(x,3.35,-3.55);s.target.position.set(x+.2,1.2,-2.4);scene.add(s);scene.add(s.target);O.lamps.push(s)});
}

function room(){
  const {scene}=O;
  const X0=-4.6,X1=4.0,Z0=-3.8,Z1=3.8,H=4.25,TH=.18;
  O.bounds={X0,X1,Z0,Z1,H};
  const carpet=new T.MeshStandardMaterial({map:tex(carpetCanvas(),{rep:[7,7]}),roughness:1});
  const slabSide=new T.MeshStandardMaterial({color:0x6c7c84,roughness:.85});
  const floor=new T.Mesh(new T.BoxGeometry(X1-X0+.24,.32,Z1-Z0+.24),[slabSide,slabSide,carpet,slabSide,slabSide,slabSide]);
  at(floor,(X0+X1)/2,-.16,(Z0+Z1)/2);floor.receiveShadow=true;scene.add(floor);
  const wallM=new T.MeshStandardMaterial({map:tex(plasterCanvas("#efebe5"),{rep:[3,2]}),roughness:.95});
  const capM=new T.MeshStandardMaterial({color:0xf7f5f2,roughness:.8});
  O.winWall=[];
  const add=(w,h,d,x,y,z)=>{const m=box(w,h,d,wallM);at(m,x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);if(Math.abs(x-(X0-TH/2))<.01)O.winWall.push(m);return m};
  // window wall (x = X0) with opening z -2.7..1.5, y 0.95..3.35
  const wx=X0-TH/2, oz0=-2.7,oz1=1.5,oy0=.95,oy1=3.35;
  add(TH,oy0,Z1-Z0,wx,oy0/2,(Z0+Z1)/2);
  add(TH,H-oy1,Z1-Z0,wx,(H+oy1)/2,(Z0+Z1)/2);
  add(TH,oy1-oy0,oz0-Z0,wx,(oy0+oy1)/2,(Z0+oz0)/2);
  add(TH,oy1-oy0,Z1-oz1,wx,(oy0+oy1)/2,(oz1+Z1)/2);
  // TV wall (z = Z0)
  add(X1-X0+TH,H,TH,(X0+X1)/2-TH/2,H/2,Z0-TH/2);
  // wall caps
  const c1=box(TH+.02,.03,Z1-Z0+.02,capM);at(c1,wx,H+.015,(Z0+Z1)/2);scene.add(c1);
  const c2=box(X1-X0+TH+.02,.03,TH+.02,capM);at(c2,(X0+X1)/2-TH/2,H+.015,Z0-TH/2);scene.add(c2);
  // baseboards
  const bb=new T.MeshStandardMaterial({color:0xf4f2ee,roughness:.6});
  const b1=box(.03,.1,Z1-Z0,bb);at(b1,X0+.015,.05,(Z0+Z1)/2);scene.add(b1);
  const b2=box(X1-X0,.1,.03,bb);at(b2,(X0+X1)/2,.05,Z0+.015);scene.add(b2);
  // window frame, glass, sill
  const frameM=new T.MeshStandardMaterial({color:0x3c4148,roughness:.45,metalness:.6});
  const fr=(w,h,d,x,y,z)=>{const m=box(w,h,d,frameM);at(m,x,y,z);m.castShadow=true;scene.add(m)};
  const fz=(oz0+oz1)/2,fy=(oy0+oy1)/2,fw=oz1-oz0,fh=oy1-oy0;
  fr(.12,.07,fw,wx,oy1-.035,fz);fr(.12,.07,fw,wx,oy0+.035,fz);fr(.12,fh,.07,wx,fy,oz0+.035);fr(.12,fh,.07,wx,fy,oz1-.035);
  fr(.08,fh,.05,wx,fy,fz+.35);fr(.08,.05,fw,wx,oy0+fh*.72,fz);
  const glass=new T.Mesh(new T.PlaneGeometry(fw,fh),new T.MeshPhysicalMaterial({color:0xcfe3ee,roughness:.05,metalness:0,transparent:true,opacity:.13,envMapIntensity:1.2,depthWrite:false}));
  glass.rotation.y=Math.PI/2;at(glass,wx,fy,fz);scene.add(glass);
  const sill=box(.34,.05,fw+.2,new T.MeshStandardMaterial({color:0xf3f1ed,roughness:.5}),.01);at(sill,X0+.08,oy0-.02,fz);sill.castShadow=sill.receiveShadow=true;scene.add(sill);
  O.window={x:wx,z:fz,y:fy,w:fw,h:fh};
  // window pick target (the glass)
  glass.userData.pickId="window";O.pick.push(glass);
  // curtains + rod
  const rodM=new T.MeshStandardMaterial({color:0x9b9ea3,metalness:.85,roughness:.3});
  const rod=cyl(.022,.022,fw+1.7,rodM,12);rod.rotation.x=Math.PI/2;at(rod,X0+.16,oy1+.28,fz);scene.add(rod);
  [-1,1].forEach(s=>{const f=sph(.045,rodM,12,8);at(f,X0+.16,oy1+.28,fz+s*(fw/2+.85));scene.add(f)});
  const curtM=new T.MeshStandardMaterial({map:tex(fabricCanvas("#6f6a64"),{rep:[4,1]}),roughness:.95,side:T.DoubleSide});
  O.curtains=[];
  [[oz0-.62,1.0],[oz1+.62,1.0]].forEach(([z,w],i)=>{
    const g=new T.PlaneGeometry(w,oy1+.22,40,1);const base=g.attributes.position.array.slice();
    const m=new T.Mesh(g,curtM);m.rotation.y=Math.PI/2;at(m,X0+.24,(oy1+.22)/2+.08,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    O.curtains.push({m,base,ph:i*1.7});
    // rings
    for(let k=0;k<9;k++){const r=new T.Mesh(new T.TorusGeometry(.04,.008,6,16),rodM);r.rotation.y=Math.PI/2;at(r,X0+.16,oy1+.27,z-w/2+k*w/8);scene.add(r)}
  });
  waveCurtains(0);
  // TV
  const tvFrame=box(3.15,1.82,.07,new T.MeshStandardMaterial({color:0xf2f1ee,roughness:.35,metalness:.1}),.025);at(tvFrame,1.45,2.3,Z0+.04);tvFrame.castShadow=true;scene.add(tvFrame);
  const tvC=document.createElement("canvas");tvC.width=1024;tvC.height=576;O.tvCanvas=tvC;O.tvTex=tex(tvC);
  const tv=new T.Mesh(new T.PlaneGeometry(3.0,1.69),new T.MeshBasicMaterial({map:O.tvTex,toneMapped:false}));at(tv,1.45,2.3,Z0+.081);scene.add(tv);
  tv.userData.pickId="tv";O.pick.push(tv,tvFrame);tvFrame.userData.pickId="tv";O.tv=tv;
  const tvGlow=new T.Sprite(new T.SpriteMaterial({map:O.glow,color:0x8fd9ff,transparent:true,opacity:.12,blending:T.AdditiveBlending,depthWrite:false}));tvGlow.scale.set(4.2,2.6,1);at(tvGlow,1.45,2.3,Z0+.3);scene.add(tvGlow);O.tvGlow=tvGlow;
  // sconces + wall glow cones
  const scM=new T.MeshStandardMaterial({color:0xf5f4f1,roughness:.35});
  const coneTex=tex(cv(128,256,(g,w,h)=>{const lg=g.createRadialGradient(w/2,0,4,w/2,40,h*.9);lg.addColorStop(0,"rgba(255,226,180,.95)");lg.addColorStop(.35,"rgba(255,214,160,.35)");lg.addColorStop(1,"rgba(255,214,160,0)");g.fillStyle=lg;g.beginPath();g.moveTo(w*.42,0);g.lineTo(w*.58,0);g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fill()}));
  O.cones=[];
  [-0.4,3.3].forEach(x=>{
    const br=box(.05,.05,.12,scM);at(br,x,3.42,Z0+.06);scene.add(br);

function poseArms(p,t,speed,amp){

function animate(){

  const dt=Math.min(.05,O.clock.getDelta());if(!O.paused)O.t+=dt;const t=O.t;const now=performance.now();

  const total=STEPS.reduce((s,x)=>s+x.dur,0);let tt=t%total,idx=0;while(tt>STEPS[idx].dur){tt-=STEPS[idx].dur;idx++}
  const step=STEPS[idx],prog=tt/step.dur;
  if(O.stepIdx!==idx){O.stepIdx=idx;O.onStep&&O.onStep(idx,step.txt(m),step.a)}
  const activeId=step.a;
  // agents
  const tmp=new T.Vector3(),tmp2=new T.Vector3();
  Object.values(O.agents).forEach(ag=>{
    const on=ag.a.id===activeId;ag.activity+=((on?1:0)-ag.activity)*Math.min(1,dt*3);
    const speed=on?18:7,amp=on?1:(Math.sin(t*.37+ag.a.seat.z*3)>.2?.6:0);
    if(!reduce)poseArms(ag.p,t+ag.a.seat.z,speed,amp);

    ag.p.torso.scale.y=1+Math.sin(t*1.6+ag.a.seat.z)*.008;
    // look: toward the active agent when idle, down at the laptop when working
    let yaw=0,pitch=.12;
    if(!on&&!reduce){const tgt=O.agents[activeId];if(tgt&&Math.sin(t*.5+ag.a.seat.z*2)>-.3){tgt.p.head.getWorldPosition(tmp);const loc=ag.g.worldToLocal(tmp.clone());yaw=Math.max(-1,Math.min(1,Math.atan2(loc.x,loc.z)));pitch=0}}
    if(on){pitch=.18+Math.sin(t*3)*.02;yaw=Math.sin(t*.8)*.08}
    ag.look+=(yaw-ag.look)*Math.min(1,dt*2.5);ag.p.headPivot.rotation.y=ag.look;ag.p.headPivot.rotation.x+=((pitch)-ag.p.headPivot.rotation.x)*Math.min(1,dt*2.5);
    // blink
    ag.blink-=dt;let sy=1;if(ag.blink<0){const b=-ag.blink;sy=b<.12?1-b/.12*.9:b<.24?.1+(b-.12)/.12*.9:1;if(b>.24)ag.blink=2+Math.random()*4}
    ag.p.eyes.forEach(e=>{e.scale.copy(e.userData.bs);e.scale[e.userData.ax]*=sy});
    const glow=(O.dark?.6:.42)+ag.activity*(O.dark?.35:.22)+(on?Math.sin(t*6)*.05:0);ag.p.glows.forEach(g=>{g.material.opacity=glow;const s=.3+ag.activity*.12;g.scale.set(s,s,1)});
    ag.p.eyes.forEach(e=>e.material.color.copy(ag.p.eyeBase).multiplyScalar(.82+ag.activity*.18));
