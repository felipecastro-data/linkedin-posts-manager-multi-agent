<style>
/* Shared design system, copied from the LinkedIn Review web app (Index.html lines 12-315). Posts-specific rules are at the end. */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#EEF0EC; --ink:#0F1513; --ink-2:#2B3430; --muted:#7D8781; --faint:#B4BBB6; --line:#E3E6E1;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.9); --glass-edge:rgba(15,21,19,.07);
  --accent:#0E7A6E; --accent-ink:#FFFFFF; --accent-soft:#DDF0EC;
  --crit:#C2442C; --crit-soft:#FBE3DD; --high:#C07A12; --high-soft:#FBEBD0; --med:#3A69A0; --med-soft:#DFE8F3; --good:#2A8A50; --good-soft:#DCF1E3;
  --particle:14,122,110; --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 24px 60px -28px rgba(15,30,25,.28),0 2px 8px -2px rgba(15,30,25,.06);
  --g1:rgba(255,255,255,.62); --g2:rgba(255,255,255,.30); --g-border:rgba(255,255,255,.75); --g-hi:rgba(255,255,255,.95); --g-lo:rgba(255,255,255,.25); --g-sheen:rgba(255,255,255,.55); --g-glow:rgba(255,255,255,.55); --inner:rgba(255,255,255,.5);
  --g-shadow:0 30px 70px -30px rgba(20,60,55,.30),0 2px 10px -2px rgba(20,40,35,.06);
  --b1:120,214,198; --b2:178,160,255; --b3:140,196,255; --b4:255,196,150; --blob-a:.55;
  --f:"Geist","Helvetica Neue",Arial,system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:22px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F0E; --surface:#131917; --surface-2:#1B2320; --ink:#EEF3F0; --ink-2:#CBD4CF; --muted:#8C9792; --faint:#4E5853; --line:#232C29;
  --glass:rgba(22,29,27,.66); --glass-line:rgba(255,255,255,.06); --glass-edge:rgba(255,255,255,.06);
  --accent:#4FD1BF; --accent-ink:#04201B; --accent-soft:#11302B;
  --crit:#F2917B; --crit-soft:#3A1D17; --high:#EBB862; --high-soft:#372912; --med:#93B8E2; --med-soft:#18263A; --good:#74D095; --good-soft:#153023;
  --particle:79,209,191; --shadow:0 24px 60px -28px rgba(0,0,0,.7),0 2px 8px -2px rgba(0,0,0,.4); --g1:rgba(34,46,42,.55); --g2:rgba(20,28,26,.30); --g-border:rgba(255,255,255,.10); --g-hi:rgba(255,255,255,.14); --g-lo:rgba(255,255,255,.03); --g-sheen:rgba(255,255,255,.07); --g-glow:rgba(120,230,215,.10); --inner:rgba(255,255,255,.05); --g-shadow:0 30px 70px -30px rgba(0,0,0,.8),0 2px 10px -2px rgba(0,0,0,.4); --b1:20,120,108; --b2:88,60,180; --b3:30,80,150; --b4:120,60,110; --blob-a:.5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0F0E; --surface:#131917; --surface-2:#1B2320; --ink:#EEF3F0; --ink-2:#CBD4CF; --muted:#8C9792; --faint:#4E5853; --line:#232C29;
  --glass:rgba(22,29,27,.66); --glass-line:rgba(255,255,255,.06); --glass-edge:rgba(255,255,255,.06);
  --accent:#4FD1BF; --accent-ink:#04201B; --accent-soft:#11302B;
  --crit:#F2917B; --crit-soft:#3A1D17; --high:#EBB862; --high-soft:#372912; --med:#93B8E2; --med-soft:#18263A; --good:#74D095; --good-soft:#153023;
  --particle:79,209,191; --shadow:0 24px 60px -28px rgba(0,0,0,.7),0 2px 8px -2px rgba(0,0,0,.4); --g1:rgba(34,46,42,.55); --g2:rgba(20,28,26,.30); --g-border:rgba(255,255,255,.10); --g-hi:rgba(255,255,255,.14); --g-lo:rgba(255,255,255,.03); --g-sheen:rgba(255,255,255,.07); --g-glow:rgba(120,230,215,.10); --inner:rgba(255,255,255,.05); --g-shadow:0 30px 70px -30px rgba(0,0,0,.8),0 2px 10px -2px rgba(0,0,0,.4); --b1:20,120,108; --b2:88,60,180; --b3:30,80,150; --b4:120,60,110; --blob-a:.5; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em;text-wrap:balance;line-height:1.08}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.muted{color:var(--muted)}
.tone{color:var(--faint)}

#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}

/* floating nav */
.nav-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.nav{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:var(--shadow);max-width:100%}
.logo{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.78rem;letter-spacing:-.02em;flex:none;margin-right:4px}
.tab{background:none;border:0;padding:7px 13px;border-radius:999px;font-size:.86rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.runpick{position:relative;margin-left:4px}
.runpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.8rem;font-weight:500;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 26px 6px 12px;cursor:pointer;max-width:170px}
.runpick::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.bottombar{display:none}
@media (max-width:820px){
  .nav .tab{display:none}
  .nav{gap:8px;padding:6px 6px 6px 6px}
  .brandname{display:block!important}
  .bottombar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;gap:2px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:var(--shadow);width:calc(100% - 32px);max-width:440px}
  .bottombar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.66rem}
  .bottombar .tab svg{width:18px;height:18px}
}
@media (max-width:420px){.brandname{display:none!important}}
.brandname{display:none;font-weight:600;font-size:.92rem;padding-right:6px;white-space:nowrap}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 140px;display:flex;flex-direction:column;gap:28px}

/* glass card */
.glass{position:relative;isolation:isolate;background:linear-gradient(140deg,var(--g1),var(--g2));backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--g-border);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),var(--g-shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(160deg,var(--g-sheen) 0%,transparent 38%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--g-glow),transparent 60%)}
.glass:hover::after{opacity:1}
.aurora{position:fixed;inset:-10%;z-index:0;pointer-events:none;overflow:hidden;transform:translateY(calc(var(--sy,0) * -0.04px))}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-a);will-change:transform}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-6%;top:4%;background:radial-gradient(circle,rgb(var(--b1)) 0%,transparent 68%);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vmax;height:40vmax;right:-8%;top:18%;background:radial-gradient(circle,rgb(var(--b2)) 0%,transparent 68%);animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:36vmax;height:36vmax;left:22%;top:58%;background:radial-gradient(circle,rgb(var(--b3)) 0%,transparent 68%);animation:drift3 29s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:30vmax;height:30vmax;right:12%;top:82%;background:radial-gradient(circle,rgb(var(--b4)) 0%,transparent 68%);animation:drift1 35s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vw,8vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vw,10vh) scale(.92)}}
@keyframes drift3{to{transform:translate(10vw,-12vh) scale(1.08)}}
.card{padding:22px}
@media (max-width:560px){.card{padding:18px}}

/* reveal motion (JS sets --p; default = rest) */
[data-rv]{will-change:transform,opacity}

/* hero scene */
.scene-hero{min-height:150vh;margin-top:-8px}
.hero-sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);min-height:calc(100vh - 100px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2vh,20px);padding-block:12px}
.hero-sticky.free{position:relative;top:auto;min-height:0}
.hero-title{font-size:clamp(1.9rem,min(6vw,7.2vh),4.2rem);font-weight:600;letter-spacing:-.045em;max-width:16ch;line-height:1.02}
.hero-title .tone{display:block}
.hero-sub{max-width:56ch;color:var(--muted);font-size:clamp(.9rem,1.9vh,1rem);line-height:1.5}
.pills{display:flex;flex-direction:column;gap:10px;width:min(420px,100%);margin-top:8px}
.pill{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 12px;border-radius:16px;text-align:left}
.pill .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.pill .ic svg{width:16px;height:16px}
.pill .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pill .tx b{font-weight:600;font-size:.88rem}
.pill .tx span{font-size:.76rem;color:var(--muted)}
.ring{flex:none;display:block}
.ring .trk{stroke:var(--line)}
.ring .val{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.spin{animation:spin 1.6s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.core{display:block;width:min(480px,92vw);height:min(30vh,300px);flex:none}
@media (max-width:560px){.core{height:min(26vh,220px)}}
@media (max-height:760px){.scrollcue{display:none}}
.pills{align-self:center;margin-inline:auto}
.themebtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);margin-left:4px;flex:none}
.themebtn svg{width:15px;height:15px}
.scrollcue{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:.72rem}
.scrollcue i{width:22px;height:34px;border:1.5px solid var(--faint);border-radius:12px;position:relative}
.scrollcue i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:6px;border-radius:2px;background:var(--muted);transform:translateX(-50%);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translate(-50%,0)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}

.over{position:relative;z-index:2;margin-top:-58vh;display:flex;flex-direction:column;gap:28px}
.scene-h{display:flex;flex-direction:column;gap:6px;padding-inline:4px}
.scene-h h2{font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:-.035em}
.scene-h h2 .tone{display:inline}

/* dashboard card */
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;overflow:hidden;padding:0}
.dash>div{padding:24px;min-width:0}
.dash>div+div{border-left:1px solid var(--line)}
@media (max-width:820px){.dash{grid-template-columns:minmax(0,1fr)}.dash>div+div{border-left:0;border-top:1px solid var(--line)}}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big .n{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.big .u{color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);font-size:.74rem}
.seg span{padding:3px 10px;border-radius:999px;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;transform:translate(-50%,-130%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.7rem;padding:4px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;transition:left .25s,top .25s}
.tip b{color:var(--accent);font-weight:500;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--inner);border:1px solid var(--g-border);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.2rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;font-weight:500;flex:none;color:#fff}
.row .tx{flex:1;min-width:0;font-size:.88rem;line-height:1.3}
.row .tx small{display:block;color:var(--muted);font-size:.74rem}
.row .v{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.high{background:var(--high-soft);color:var(--high)} .chip.med{background:var(--med-soft);color:var(--med)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.src{font-family:var(--mono);font-size:.66rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap;background:var(--surface)}
.src:hover{border-color:var(--accent);color:var(--accent)}
.src.key{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}

/* roadmap */
.rm-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.rm{min-width:540px;display:grid;grid-template-columns:minmax(160px,30%) minmax(0,1fr);row-gap:16px;column-gap:16px;align-items:center}
.rm-axis{position:relative;height:16px}
.rm-axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:.64rem;color:var(--muted)}
.rm-axis span:first-child{transform:none}.rm-axis span:last-child{transform:translateX(-100%)}
.rm-label{font-size:.85rem;line-height:1.3;min-width:0}
.rm-label b{font-weight:600;display:block}
.rm-label span{font-size:.74rem;color:var(--muted)}
.rm-track{position:relative;height:28px;border-radius:999px;background:var(--surface-2)}
.rm-bar{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;transform-origin:left center}
.rm-bar.critical{background:linear-gradient(90deg,color-mix(in srgb,var(--crit) 25%,transparent),color-mix(in srgb,var(--crit) 70%,transparent))}
.rm-bar.high{background:linear-gradient(90deg,color-mix(in srgb,var(--high) 25%,transparent),color-mix(in srgb,var(--high) 70%,transparent))}
.rm-bar.medium{background:linear-gradient(90deg,color-mix(in srgb,var(--med) 25%,transparent),color-mix(in srgb,var(--med) 70%,transparent))}
.rm-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);transform:translate(-50%,-50%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:9px;margin-right:6px;vertical-align:middle}

/* checklist */
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-sm);cursor:pointer;transition:transform .2s}
.check:hover{transform:translateY(-1px)}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:50%;flex:none;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--inner);transition:background .2s,border-color .2s}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0;font-size:.92rem}
.check.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.check .ref{font-family:var(--mono);font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;padding-top:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.since{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.since li{display:flex;gap:12px;font-size:.92rem}
.since li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:.55em;flex:none;box-shadow:0 0 0 4px var(--accent-soft)}

/* tab pages */
.page-hero{display:flex;flex-direction:column;gap:12px;padding-block:28px 6px;align-items:flex-start}
.page-hero h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.045em;max-width:18ch}
.page-hero h1 .tone{display:block}
.page-hero p{max-width:62ch;color:var(--muted);font-size:1rem}
.enter>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}.enter>*:nth-child(6){animation-delay:.3s}.enter>*:nth-child(n+7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:1.4rem;letter-spacing:-.03em}
.sec-h .muted{font-size:.86rem}

details.item{border-radius:var(--r)}
details.item>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
details.item>summary::-webkit-details-marker{display:none}
.sum-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sum-main h3{font-size:1.05rem;letter-spacing:-.015em;line-height:1.3}
.plus{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .25s,background .2s;background:var(--surface)}
.plus svg{width:12px;height:12px;color:var(--muted)}
details[open] .plus{transform:rotate(45deg);background:var(--surface-2)}
.item-body{padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:14px}
@media (max-width:560px){.item-body{padding:0 18px 18px 18px}}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 14px;font-size:.92rem}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}

.move h3{font-size:1.1rem;line-height:1.25}
.move p{font-size:.9rem}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:560px){.swot{grid-template-columns:minmax(0,1fr)}}
.swot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:.9rem}
.signal{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.signal:last-child{border-bottom:0}
.signal .n{font-family:var(--mono);font-size:.7rem;color:var(--faint);padding-top:.25em;width:22px;flex:none}
.signal .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:.94rem}

.score{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}

.score .note{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.kwchip{font-size:.8rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.kwchip.miss{border-style:dashed;border-color:var(--high);color:var(--high);background:var(--high-soft)}
.diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:700px){.diff{grid-template-columns:minmax(0,1fr)}}
.pane{border-radius:var(--r-sm);padding:12px 14px;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.pane.before{background:var(--inner);border:1px solid var(--g-border);color:var(--muted)}
.pane.after{background:var(--accent-soft);color:var(--ink)}
.pane-h{display:flex;align-items:center;gap:8px}
.copy{margin-left:auto;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.sources li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.sources li:last-child{border-bottom:0}
.pub{font-family:var(--mono);font-size:.66rem;min-width:64px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-align:center;white-space:nowrap}
.pub.key{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:60ch;margin:12vh auto 0;padding:28px}
.empty code{font-family:var(--mono);background:var(--surface-2);padding:2px 7px;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.84rem;z-index:60}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.qgrid{grid-template-columns:minmax(0,1fr)}.qgrid>.qcard{grid-column:auto!important}}
.qcard{display:flex;flex-direction:column;gap:12px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px}
.qn{font-family:var(--mono);font-size:.7rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none}
.qans{font-size:1.02rem;letter-spacing:-.01em;line-height:1.45}
.qbig{font-size:1.5rem;letter-spacing:-.03em}
.bigans{font-size:2rem;font-weight:600;letter-spacing:-.04em;line-height:1}
.bigans.good{color:var(--good)}.bigans.high{color:var(--high)}.bigans.crit{color:var(--crit)}.bigans.acc{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--inner);border:1px solid var(--g-border);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;font-size:.88rem}
.tile.rec{outline:2px solid var(--accent);outline-offset:-2px}
.tile-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile-h b{font-weight:600}
.meter{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both .15s}
.countcmp{display:flex;gap:10px}
.countcmp>div{flex:1;background:var(--inner);border:1px solid var(--g-border);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column}
.countcmp b{font-size:1.6rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.countcmp span{font-size:.72rem;color:var(--muted)}
.qcard .row{gap:10px}
.qcard>.chip,.qcard>.tag,.qcard>.chips{align-self:flex-start}
.tag{display:inline-block;font-size:.82rem;line-height:1.35;padding:5px 11px;border-radius:12px;background:var(--inner);border:1px solid var(--g-border);color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.qcard .chip{max-width:100%;white-space:normal}
.scorewrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.bigring{width:132px;height:132px;flex:none}
.scgrid{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
@media (max-width:620px){.scgrid{grid-template-columns:minmax(0,1fr)}}
.scrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:.86rem}
.scrow .meter{grid-column:1/-1}
.scrow small{grid-column:1/-1;color:var(--muted);font-size:.76rem;line-height:1.35}
.readiness{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.range{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.range-top{display:flex;align-items:baseline;gap:8px}.range-top b{margin-left:auto;font-size:.86rem;font-weight:600;color:var(--accent)}
.range-track{position:relative;height:10px;border-radius:9px;background:var(--surface-2)}
.range-track i{position:absolute;inset:0;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 25%,transparent),color-mix(in srgb,var(--accent) 75%,transparent))}
.range-t{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.range-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kv.mini{grid-template-columns:56px minmax(0,1fr);font-size:.8rem;gap:4px 10px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:st}
.path li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 12px;padding:8px 0;position:relative;font-size:.88rem}
.path li::before{counter-increment:st;content:counter(st);grid-row:span 2;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:.68rem;display:grid;place-items:center}
.path li span{color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- LinkedIn Posts additions ---------- */
.when{width:54px;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px;font-family:var(--mono);line-height:1.1}
.when small{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.when b{font-size:1.35rem;font-weight:600;letter-spacing:-.03em;font-family:var(--f)}
.list{display:flex;flex-direction:column;gap:12px}
.cut{display:flex;align-items:center;gap:12px;margin:6px 0;color:var(--muted)}
.cut::before,.cut::after{content:"";flex:1;height:1px;background:var(--line)}
.sumring{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.sumring svg{position:absolute;inset:0}
.sumring b{font-family:var(--mono);font-size:.8rem;font-weight:500;font-variant-numeric:tabular-nums}
.segbtn{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);font-size:.76rem;margin-left:auto}
.segbtn button{background:none;border:0;padding:4px 11px;border-radius:999px;color:var(--muted);cursor:pointer}
.segbtn button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ctx{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.heat-wrap{overflow-x:auto;margin-inline:-6px;padding:4px 6px 6px}
.heat{border-collapse:separate;border-spacing:3px;min-width:720px;width:100%;font-size:.76rem}
.heat th{font-weight:500;color:var(--muted);text-align:left;white-space:nowrap}
.heat thead th{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;vertical-align:bottom;padding:0 2px 6px;white-space:normal;line-height:1.2;max-width:84px}
.heat tbody th{padding:0 10px 0 6px;font-size:.8rem;color:var(--ink-2);position:sticky;left:0;z-index:1;background:var(--surface);border-radius:8px}
.heat td{height:34px;min-width:44px;border-radius:8px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface-2);position:relative;cursor:default}
.heat td.z{color:var(--faint)}
.heat td:hover{outline:2px solid var(--ink);outline-offset:-2px}
.heat td i{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.htip{position:fixed;z-index:70;max-width:280px;background:var(--ink);color:var(--bg);font-size:.76rem;line-height:1.4;padding:8px 10px;border-radius:9px;pointer-events:none;transform:translate(-50%,calc(-100% - 10px))}
.htip b{display:block;font-weight:600;margin-bottom:2px}
.ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ops{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cov{display:flex;flex-direction:column;gap:8px}
.covrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 12px;align-items:center;font-size:.84rem}
.covrow .v{font-family:var(--mono);font-size:.76rem;text-align:right;white-space:nowrap}
.covrow .v .up,.covrow .v .dn{color:var(--ink);font-weight:600}
.covrow .meter{grid-column:1/-1}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.runrow{width:100%;text-align:left;background:none;border:0;cursor:pointer}
.runrow[aria-current="true"] .tx{font-weight:600}
/* ---------- Office (3D) ---------- */
.ostage{position:relative;height:min(80vh,800px);min-height:520px;padding:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--surface) 70%,transparent),transparent 75%),linear-gradient(140deg,var(--g1),var(--g2))}
@media (max-width:820px){.ostage{height:calc(100vh - 170px);min-height:460px}}
.o-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
.o-top{position:absolute;left:20px;right:20px;top:18px;display:flex;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.o-top h2{font-size:clamp(1.3rem,2.6vw,1.9rem);letter-spacing:-.035em;margin-top:4px}
.o-btns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.o-btn{font-size:.78rem;padding:6px 12px;border-radius:999px;border:1px solid var(--g-border);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);cursor:pointer}
.o-btn:hover{border-color:var(--accent);color:var(--accent)}
.o-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);z-index:2}
.o-ticker{position:absolute;left:16px;bottom:16px;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:.82rem}
.o-tk{display:flex;flex-direction:column;line-height:1.25;min-width:0}.o-tk b{font-weight:600}.o-tk span{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:opulse 1.6s infinite;flex:none}
@keyframes opulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.o-dots{display:flex;gap:4px;margin-left:6px}.o-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.o-dots i.on{background:var(--accent)}
@media (max-width:560px){.o-dots{display:none}}
.o-hint{position:absolute;right:18px;bottom:22px;z-index:3;font-family:var(--mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;pointer-events:none}
@media (max-width:820px){.o-hint{display:none}}
.o-status{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font-size:.72rem;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap;transition:opacity .3s;box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
.o-tag{position:absolute;left:0;top:0;z-index:4;pointer-events:none;font-size:.74rem;padding:4px 9px;border-radius:8px;background:var(--ink);color:var(--bg)}
.ocard{position:absolute;z-index:5;right:16px;top:64px;bottom:16px;background:linear-gradient(140deg,color-mix(in srgb,var(--surface) 80%,transparent),color-mix(in srgb,var(--surface) 66%,transparent));width:min(380px,calc(100% - 32px));overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;animation:ocard .4s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8)}
@media (max-width:700px){.ocard{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:54%}}
.oc-h{display:flex;gap:12px;align-items:flex-start}.oc-h h3{font-size:1.25rem;letter-spacing:-.025em;margin-top:2px}.oc-h p{font-size:.84rem;margin-top:2px}
.oc-av{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 0%,transparent),0 0 12px 2px rgba(255,158,181,.35)}
.oc-x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted);flex:none}
.oc-x:hover{color:var(--ink);border-color:var(--ink)}
.oc-desc{font-size:.9rem;color:var(--ink-2)}
.oc-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.oc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}
.oc-stats .stat b small{font-size:.7rem;color:var(--muted);margin-left:1px}
.oc-stats .stat span{text-transform:capitalize}
.oc-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.oc-day{border-radius:10px;padding:7px 8px;background:var(--surface-2);font-size:.7rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.oc-day b{font-family:var(--mono);font-weight:500}.oc-day span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-day.on{background:var(--accent-soft)}.oc-day.on span{color:var(--accent)}
.bottombar .tab span{white-space:nowrap}
.o-loading[hidden],.ocard[hidden],.o-status[hidden],.o-tag[hidden]{display:none!important}
.o-btn{white-space:nowrap}

/* office run metrics under the 3D frame, after LinkedIn Review's Office tab */
.office{display:flex;flex-direction:column;gap:18px}
.om-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.om-tile{padding:16px 18px;min-width:0}
.om-tile b{display:block;font-size:1.6rem;font-weight:600;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.om-tile small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.om-pipe{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.om-pipe li{padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);transition:background .25s,color .25s}
.om-pipe li.sep{background:none;padding:0;color:var(--faint)}
.om-pipe li.done{color:var(--ink)}
.om-pipe li.on{background:var(--c,var(--accent));color:#14161a}
.om-tl{position:relative;display:grid;gap:6px;padding-left:96px}
.om-tl-row{position:relative;height:16px;border-radius:6px;background:var(--surface-2)}
.om-tl-row span{position:absolute;left:-96px;top:0;width:90px;font-size:.74rem;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.om-tl-row i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--c)}
.om-head{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none}
.om-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.om-sc{display:grid;gap:10px}
.om-sc-row{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.om-sc-row .v{font-family:var(--mono);font-size:.76rem;color:var(--ink);text-align:right}
.om-bar{display:flex;gap:2px;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.om-bar i{display:block;height:100%;border-radius:4px;min-width:3px}
.om-legend{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--muted)}
.om-legend li{display:flex;align-items:center;gap:6px}
.om-sw{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.om-cmp{display:grid;gap:4px}
.om-cmp-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 10px;color:inherit;font:inherit}
.om-cmp-row:hover,.om-cmp-row:focus-visible,.om-cmp-row.cur{background:var(--inner);border-color:var(--g-border)}
.om-cmp-when{font-size:.8rem;font-weight:600}
.om-cmp-bar{display:flex;gap:2px;height:14px}
.om-cmp-bar i{display:block;height:100%;border-radius:4px;min-width:3px}
.om-cmp-nums{font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.om-cmp-nums b{color:var(--ink);font-size:.9rem;font-weight:600}
.om-table{margin-top:12px;font-size:.78rem}
.om-table summary{cursor:pointer;font-weight:600;color:var(--muted)}
.om-table div{overflow-x:auto;margin-top:8px}
.om-table table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
